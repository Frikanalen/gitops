apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner-chart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rancher/local-path-provisioner.git
    targetRevision: v0.0.36
    path: deploy/chart/local-path-provisioner
    helm:
      values: |
        storageClass:
          name: local-ssd
          defaultClass: false
          reclaimPolicy: Delete
        # Must match roles/local_ssd_mount's local_ssd_mount_path in the
        # infra repo, which formats and mounts the disk at this path.
        nodePathMap:
          - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
            paths:
              - /mnt/localssd
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
