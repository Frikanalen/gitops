name: MediaMTX chart
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - helm/mediamtx/**
      - .github/workflows/mediamtx.yaml
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Lint chart
        run: >-
          helm lint helm/mediamtx
          --set authURL=http://django-api.default.svc.cluster.local:8080/api/mediamtx/auth
          --set service.loadBalancerIP=192.168.3.93
      - name: Test monitoring, preview and WebRTC rendering
        run: python helm/mediamtx/tests/check_render.py
