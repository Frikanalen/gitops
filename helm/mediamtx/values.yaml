image:
  repository: bluenviron/mediamtx
  tag: "1.21.3"
  pullPolicy: IfNotPresent
service:
  loadBalancerIP: ""
authURL: ""
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Packets MediaMTX queues for each reader before discarding (a power of two).
# Unset keeps MediaMTX's 512, about half a second of a 10 Mbit/s feed. A
# contribution arriving in bursts over the internet needs more, or a reader
# that plays in real time, like CasparCG, loses frames to "reader is too slow".
writeQueueSize: null

# Django authorizes each exact path. All paths live under contrib/ so the
# WebRTC Ingress needs a single prefix on the site's hostname. An explicit UUID path can later override
# this with alwaysAvailable: true; MediaMTX forbids fallback on regex paths.
paths:
  "~^contrib/live/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$": {}

webrtc:
  enabled: false
  # The site's hostname; the Ingress claims /contrib on it.
  hostname: ""
  # Extra browser origins allowed to call WHEP/WHIP. The hostname's own
  # origin is always allowed.
  allowOrigins: []
  ingressClassName: public
  certResolver: letsencrypt
  additionalHosts: []

preview:
  enabled: false
  # Replaces image above while enabled: the same MediaMTX build plus FFmpeg.
  image: bluenviron/mediamtx:1.21.3-ffmpeg
  # Every WebRTC browser can decode VP8, Firefox included without its
  # OpenH264 plugin, so the preview is a small VP8 copy of the picture.
  videoHeight: 360
  videoBitrate: 1M
  videoFps: 25
  # Each watched source decodes its contribution and encodes VP8, about one
  # core for 1080p; at the plain limit of one core the converter fell behind
  # and MediaMTX dropped its input. Replaces resources above while enabled.
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "4"
      memory: 1Gi
  opusBitrate: 96k
  opusFrameDuration: 10
  # How long a reader waits for the converter's first packets, and how long
  # the converter outlives its last reader.
  startTimeout: 5s
  closeAfter: 10s

monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
