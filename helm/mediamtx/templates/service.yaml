apiVersion: v1
kind: Service
metadata:
  name: mediamtx
  labels:
    app: mediamtx
spec:
  type: LoadBalancer
  loadBalancerIP: {{ required "service.loadBalancerIP must be reserved for MediaMTX" .Values.service.loadBalancerIP | quote }}
  externalTrafficPolicy: Local
  selector:
    app: mediamtx
  ports:
    - name: srt
      port: 8890
      targetPort: srt
      protocol: UDP
    - name: rtmp
      port: 1935
      targetPort: rtmp
      protocol: TCP
    - name: rtsp
      port: 8554
      targetPort: rtsp
      protocol: TCP

{{- if .Values.webrtc.enabled }}
    - name: webrtc-udp
      port: 8189
      targetPort: webrtc-udp
      protocol: UDP
    - name: webrtc-tcp
      port: 8189
      targetPort: webrtc-tcp
      protocol: TCP
{{- end }}
